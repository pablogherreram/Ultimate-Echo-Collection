[package]
name = "pablo3xdd_announcer_c04"
version = "0.1.0"
authors = ["PHDev / Pablo Herrera"]
edition = "2021"

[package.metadata.skyline]
titleid = "01006A800016E000"

[lib]
crate-type = ["cdylib"]

[dependencies]
skyline = { git = "https://github.com/ultimate-research/skyline-rs" }
skyline_smash = { git = "https://github.com/blu-dev/skyline-smash.git", features = ["weak_l2cvalue"] }
arcropolis-api = { git = "https://github.com/Raytwo/arcropolis_api" }
the_csk_collection_api = { git = "https://github.com/Coolsonickirby/the_csk_collection_api" }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1
