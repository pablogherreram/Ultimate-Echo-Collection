name: Build generic auto-slotting template
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - reorganizacion-multiproyecto
    paths:
      - "template/plugin-source/**"
      - ".github/workflows/build-template.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build generic Skyline template
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: template/plugin-source
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev binutils
      - name: Install cargo-skyline
        run: |
          cargo install cargo-skyline --locked
          cargo skyline --version
      - name: Prepare Skyline standard library
        timeout-minutes: 10
        env:
          CARGO_TERM_COLOR: always
          RUST_BACKTRACE: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euxo pipefail
          timeout --signal=TERM 9m cargo skyline update-std
      - name: Patch obsolete skyline-smash dependency
        run: |
          set -euxo pipefail
          sed -i 's#https://github.com/blu-dev/skyline-smash\.git#https://github.com/ultimate-research/skyline-smash.git#g' Cargo.toml
          rm -f Cargo.lock
      - name: Build generic template
        timeout-minutes: 20
        env:
          CARGO_TERM_COLOR: always
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          RUST_BACKTRACE: full
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euxo pipefail
          timeout --signal=TERM 19m cargo skyline build --release
      - name: Package template NRO
        shell: bash
        run: |
          set -euo pipefail
          nro_file="$(find target -type f -name '*.nro' -print -quit)"
          test -n "$nro_file" || { echo "::error::No NRO generated."; exit 1; }
          mkdir -p dist
          cp "$nro_file" dist/plugin.nro
          sha256sum dist/plugin.nro | tee dist/SHA256SUMS.txt
      - name: Upload template artifact
        uses: actions/upload-artifact@v4
        with:
          name: generic-auto-slotting-template
          path: |
            template/plugin-source/dist/plugin.nro
            template/plugin-source/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

