name: Build Dry Bowser auto-slotting plugin

on:
  workflow_dispatch:
  push:
    branches:
      - feature/dry-bowser-plugin
    paths:
      - "projects/dry-bowser/plugin-source/**"
      - ".github/workflows/build-dry-bowser.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Dry Bowser Skyline NRO
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: projects/dry-bowser/plugin-source

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display project files
        run: |
          echo "Dry Bowser plugin project files:"
          find . -maxdepth 3 -type f | sort

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev binutils

      - name: Display Rust environment
        run: |
          rustc --version
          cargo --version
          rustup --version
          git --version

      - name: Install cargo-skyline
        run: |
          cargo install cargo-skyline --locked
          cargo skyline --version
          cargo skyline --help

      - name: Prepare Skyline standard library
        timeout-minutes: 10
        env:
          CARGO_TERM_COLOR: always
          RUST_BACKTRACE: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euxo pipefail
          timeout --signal=TERM 9m cargo skyline update-std

      - name: Patch obsolete skyline-smash dependency
        run: |
          set -euxo pipefail

          echo "Cargo.toml before patch:"
          cat Cargo.toml

          if grep -q "github.com/blu-dev/skyline-smash" Cargo.toml; then
            sed -i \
              's#https://github.com/blu-dev/skyline-smash\.git#https://github.com/ultimate-research/skyline-smash.git#g' \
              Cargo.toml
          fi

          echo "Removing the obsolete lockfile so Cargo can resolve the maintained source."
          rm -f Cargo.lock

          echo "Cargo.toml after patch:"
          cat Cargo.toml

          if grep -q "github.com/blu-dev/skyline-smash" Cargo.toml; then
            echo "::error::The obsolete blu-dev skyline-smash URL is still present."
            exit 1
          fi

      - name: Build Dry Bowser plugin
        timeout-minutes: 20
        env:
          CARGO_TERM_COLOR: always
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          RUST_BACKTRACE: full
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euxo pipefail
          timeout --signal=TERM 19m cargo skyline build --release

      - name: Locate and validate Dry Bowser NRO
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated files under target:"
          find target -type f | sort

          NRO_FILE="$(find target -type f -name '*.nro' -print -quit)"

          if [ -z "$NRO_FILE" ]; then
            echo "::error::Compilation did not produce an NRO file."
            exit 1
          fi

          echo "NRO found at: $NRO_FILE"

          mkdir -p dist
          cp "$NRO_FILE" dist/plugin.nro

          echo "NRO size:"
          stat -c '%n: %s bytes' dist/plugin.nro

          echo "NRO SHA-256:"
          sha256sum dist/plugin.nro | tee dist/SHA256SUMS.txt

          echo "Checking required Dry Bowser identifiers:"
          strings -a dist/plugin.nro | grep -F "ui_chara_koopadry"
          strings -a dist/plugin.nro | grep -F "fighter_kind_koopa"
          strings -a dist/plugin.nro | grep -F "koopadry.marker"

      - name: Upload Dry Bowser plugin
        uses: actions/upload-artifact@v4
        with:
          name: dry-bowser-autoslotting-plugin
          path: |
            projects/dry-bowser/plugin-source/dist/plugin.nro
            projects/dry-bowser/plugin-source/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
